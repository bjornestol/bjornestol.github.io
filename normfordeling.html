title: Normalfordeling
---

<p>Dine tilfeldige tall er:</p>
<div id="gridcontainer" style="display:grid;grid-template-columns:repeat(5,1fr);">
</div>

<script type="text/javascript">
  function gaussianRandom(mean=0, stdev=1) {
    let u = 1 - Math.random();
    let v = Math.random();
    let z = Math.sqrt (- 2.0 * Math.log(u)) * Math.cos(2.0*Math.PI*v);
    return mean + z*stdev;
  }
  let mean = 17;
  let stdev = 6;
  let randNums = Array.from({length: 15}, _ => gaussianRandom(mean, stdev).toFixed(4))
  
  grd = document.getElementById("gridcontainer")
  for (i in randNums) {
    k = document.createElement("div");
    k.innerHTML = randNums[i];
    grd.append(k);
  }
</script>
