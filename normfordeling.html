<p>Tallene som vil genereres under kommer fra en normalfordeling med <q>hemmelig</q> forventningsverdi og standardavvik.</p>
<p>Fyll inn ditt tilfeldige ord under, og trykk <q>Hent tall</q>.</p>
<p>Ordet lagres ikke, brukes kun til å bestemme hvilke tilfeldige tall som hentes.</p>
<form>
  <input id="firstname" type="text">
  <input type="button" onclick="generateNumbers();" value="Hent tall">
</form>

<div id="gridcontainer">
</div>

<script type="text/javascript">
  
  function gaussianRandom(mean=0, stdev=1, rnd=Math.random) {
    let u = 1 - rnd();
    let v = rnd();
    let z = Math.sqrt (- 2.0 * Math.log(u)) * Math.cos(2.0*Math.PI*v);
    return mean + z*stdev;
  }
  function cyrb128(str) {
    let h1 = 1779033703, h2 = 3144134277,
        h3 = 1013904242, h4 = 2773480762;
    for (let i = 0, k; i < str.length; i++) {
        k = str.charCodeAt(i);
        h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
        h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
        h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
        h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
    }
    h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
    h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
    h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
    h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
    return [(h1^h2^h3^h4)>>>0, (h2^h1)>>>0, (h3^h1)>>>0, (h4^h1)>>>0];
  }
  function sfc32(a, b, c, d) {
    return function() {
      a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0; 
      var t = (a + b) | 0;
      a = b ^ b >>> 9;
      b = c + (c << 3) | 0;
      c = (c << 21 | c >>> 11);
      d = d + 1 | 0;
      t = t + d | 0;
      c = c + t | 0;
      return (t >>> 0) / 4294967296;
    }
  }
  function generateNumbers() {
    let fname = document.getElementById("firstname").value;
    let seed = cyrb128(fname);
    let rnd = sfc32(seed[0], seed[1], seed[2], seed[3]);
    let mean = 17;
    let stdev = 6;
    let randNums = Array.from({length:15}, _ => gaussianRandom(mean, stdev, rnd).toFixed(4));
    
    let intro = document.createElement("p")
    intro.innerHTML = "Dine tilfeldige tall er:"
    let grd = document.createElement("div")
    grd.setAttribute("style", "display:grid;grid-template-columns:repeat(5,1fr);")
    
    for (i in randNums) {
      k = document.createElement("div");
      k.innerHTML = randNums[i]
      grd.append(k);
    }
    let newbdy = document.createElement("div");
    newbdy.setAttribute("id", "gridcontainer")
    newbdy.append(intro)
    newbdy.append(grd)
    
    let bdy = document.getElementById("gridcontainer")
    bdy.replaceWith(newbdy)
  }
</script>
