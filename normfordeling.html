Dine tilfeldige tall er:

<script type="text/javascript">
  function gaussianRandom(mean=0, stdev=1) {
    let u = 1 - Math.random();
    let v = Math.random();
    let z = Math.sqrt (- 2.0 * Math.log(u)) * Math.cos(2.0*Math.PI*v);
    return mean + z*stdev;
  }
  let mean = 17;
  let stdev = 6;
  let randNums1 = Array.from({length: 5}, _ => gaussianRandom(mean, stdev).toFixed(4)).join(" ")
  let docrn1 = document.createElement("p")
  docrn1.append(randNums1)
  let randNums2 = Array.from({length: 5}, _ => gaussianRandom(mean, stdev).toFixed(4)).join(" ")
  let docrn2 = document.createElement("p")
  docrn2.append(randNums2)
  let randNums3 = Array.from({length: 5}, _ => gaussianRandom(mean, stdev).toFixed(4)).join(" ")
  let docrn3 = document.createElement("p")
  docrn3.append(randNums3)
  
  bdy = document.getElementsByClass("post-container")[0]
  bdy.append(docrn1)
  bdy.append(docrn2)
  bdy.append(docrn3)
</script>
