<!DOCTYPE html>
<html>
<head>
  <style>
    * {
      margin: 0;
      padding: 0;
      font-family: "Helvetica Neue", sans-serif;
      box-sizing: border-box;
    }

    body {
      background-color: #8bc6ec;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
        background: #000000;
        padding: 25px;
        width: 275px;
        border-radius: 10px;
        color: white;
    }

    .calc-text {
      margin-bottom: 20px;
      padding-left: 5px;
    }

    .calc-text p {
      width: 100%;
      font-size: 3.5rem;
      text-align: end;
      background: transparent;
      color: #fff;
      border: none;
      outline: none;
      word-wrap: break-word;
      word-break: break-all;
    }

    button {
      background: #333333;
      color: #fff;
      font-size: 1.5rem;
      border: none;
      border-radius: 70%;
      cursor: pointer;
      height: 65px;
      width: 65px;
    }

    button:active,
    button:focus {
      filter: brightness(120%);
    }

    .calc-keys {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-row-gap: 15px;
      grid-column-gap: 10px;
    }

    .key-operate {
      background: #ff9501;
    }

    .key-others {
      background: #a6a6a6;
      color: #000000;
    }
  </style>
</head>
<body>
    <div class="container">
      <div class="calc-text">
      <p name="user-input" id="user-input">Ø</p>
      </div>
      <div class="calc-keys">
        <button type="button" class="key-others operations clear">C</button>
        <button type="button" class="key-operate operations eml">EML</button>
        <button type="button" class="one">1</button>
      </div>
    </div>
<script>
  var stack = [];
  const inputValue = document.getElementById("user-input");
  function updateDisplay() {
    if (stack.length == 0) {
      inputValue.innerText = "Ø"
    } else {
      inputValue.innerText = stack.toString();
    }
  }
  const one = document.querySelector(".one");
  one.addEventListener("click", e => {
    stack.push(1);
    updateDisplay();
  });
  const clear = document.querySelector(".clear");
  clear.addEventListener("click", e => {
    stack = [];
    updateDisplay();
  });
  const eml = document.querySelector(".eml");
  eml.addEventListener("click", e => {
    if (stack.length < 2) {
      console.log("Error: Need at least two numbers on stack to use EML");
    } else {
      const x = stack.pop();
      const y = stack.pop();
      stack.push(Math.exp(x) - Math.log(y));
      updateDisplay();
    }
  });
</script>
</body>
</html>
